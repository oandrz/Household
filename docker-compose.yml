name: hearth

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hearth
      POSTGRES_PASSWORD: hearth
      POSTGRES_DB: hearth
    ports: ["5432:5432"]
    volumes: ["hearth-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hearth -d hearth"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: ./api, target: dev }
    working_dir: /src
    environment:
      DATABASE_URL: postgres://hearth:hearth@postgres:5432/hearth?sslmode=disable
    command: >
      sh -c 'goose -dir ./migrations postgres "$$DATABASE_URL" up'
    volumes: ["./api:/src"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: { context: ./api, target: dev }
    environment:
      APP_ENV: development
      PORT: "8080"
      DATABASE_URL: postgres://hearth:hearth@postgres:5432/hearth?sslmode=disable
      SMTP_ADDR: mailpit:1025
      SMTP_FROM: "Hearth <noreply@hearth.localhost>"
      APP_BASE_URL: http://localhost:5173
      ARGON2_TIME: "3"
      ARGON2_MEMORY_KIB: "65536"
      ARGON2_THREADS: "2"
    ports: ["8080:8080"]
    volumes: ["./api:/src"]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://api:8080
    ports: ["5173:5173"]
    volumes:
      - ./web:/app
      - hearth-node-modules:/app/node_modules
    depends_on: [api]

  mailpit:
    image: axllent/mailpit:v1.30.5
    ports: ["8025:8025", "1025:1025"]

volumes:
  hearth-pgdata:
  hearth-node-modules:
