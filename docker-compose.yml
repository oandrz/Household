name: hearth

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hearth
      POSTGRES_PASSWORD: hearth
      POSTGRES_DB: hearth
    ports: ["5432:5432"]
    volumes: ["hearth-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hearth -d hearth"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: { context: ./api, target: dev }
    working_dir: /src
    environment:
      DATABASE_URL: postgres://hearth:hearth@postgres:5432/hearth?sslmode=disable
    command: >
      sh -c 'goose -dir ./migrations postgres "$$DATABASE_URL" up'
    volumes: ["./api:/src"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # The read-only role the admin database browse reads through. A one-shot,
  # like migrate, because a role is provisioning rather than schema:
  # migrations do not run as a superuser and creating a role is not a change
  # to the shape of the data.
  #
  # postgres:17-alpine rather than the api image: this needs psql, and the api
  # dev image carries goose. Not docker-entrypoint-initdb.d either -- that
  # runs only when the data directory is created, and hearth-pgdata already
  # exists on every machine that has run this stack, so a developer would get
  # a not-configured panel whose only fix is destroying their database.
  readonly-role:
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGUSER: hearth
      PGPASSWORD: hearth
      PGDATABASE: hearth
      # The dev password, written here rather than in readonly-role.sql: that
      # file is also executed by the Go suite through pgx, and psql's :'var'
      # interpolation is client-side syntax pgx would reject.
      READONLY_PASSWORD: hearth-readonly
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        psql -v ON_ERROR_STOP=1 -f /sql/readonly-role.sql
        psql -v ON_ERROR_STOP=1 -c "ALTER ROLE hearth_readonly PASSWORD '$$READONLY_PASSWORD'"
    volumes: ["./deploy/readonly-role.sql:/sql/readonly-role.sql:ro"]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: "no"

  api:
    build: { context: ./api, target: dev }
    environment:
      APP_ENV: development
      PORT: "8080"
      DATABASE_URL: postgres://hearth:hearth@postgres:5432/hearth?sslmode=disable
      # The database browse's own connection: hearth_readonly, created by the
      # readonly-role one-shot above. Hardcoded here for the same reason
      # MAILPIT_API_URL is -- a developer must not have to configure the
      # feature to discover it exists. Unset means the panel says it is not
      # configured, and there is no fallback to DATABASE_URL.
      DATABASE_READONLY_URL: postgres://hearth_readonly:hearth-readonly@postgres:5432/hearth?sslmode=disable
      SMTP_ADDR: mailpit:1025
      # Mailpit always runs at this address in the dev stack and its API port
      # is fixed; hardcoding it here means the admin mail inspector works
      # without configuration, and developers won't find a non-existent bug in
      # the screen when it says it is not configured.
      MAILPIT_API_URL: http://mailpit:8025
      SMTP_FROM: "Hearth <noreply@hearth.localhost>"
      APP_BASE_URL: http://localhost:5173
      ARGON2_TIME: "3"
      ARGON2_MEMORY_KIB: "65536"
      ARGON2_THREADS: "2"
      # The only two values in this file that come from the developer's own
      # .env rather than being written here. A bot token is a credential, so
      # it must never live in a committed file -- and without this passthrough
      # a token in .env would simply never reach the container, leaving
      # Telegram sign-in silently off with no error to read (the route just
      # 404s and the button hides itself). `make dev-local` already sourced
      # .env, so it worked; the Docker path did not, which is exactly the kind
      # of gap that only shows up in a real walk.
      #
      # The `:-` default is what keeps a machine with no .env booting: unset
      # becomes empty, and empty on BOTH is the "Telegram is off"
      # configuration config.Load accepts. Setting exactly one is refused at
      # startup, deliberately.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
    ports: ["8080:8080"]
    volumes: ["./api:/src"]
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      readonly-role: { condition: service_completed_successfully }

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://api:8080
    ports: ["5173:5173"]
    volumes:
      - ./web:/app
      - hearth-node-modules:/app/node_modules
    depends_on: [api]

  mailpit:
    image: axllent/mailpit:v1.30.5
    ports: ["8025:8025", "1025:1025"]

volumes:
  hearth-pgdata:
  hearth-node-modules:
