name: ci

# Every pull request is linted and tested. Only main builds images, and only
# after both checks pass on the merged commit: a branch build would push tags
# nobody deploys and spend the free minutes that make this arrangement free.
#
# The job ids `lint`, `test` and `images` are the names branch protection
# requires on main. Renaming any of them makes every pull request wait for a
# check that will never report.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default, because this workflow runs code from every pull
# request. The build job alone asks for more.
permissions:
  contents: read

# A newer push to a pull request makes its older run pointless, so runs for
# one pull request share a group and the older one is cancelled.
#
# On main every commit gets a group of its own, keyed by its SHA. Don't key
# main by the branch: GitHub keeps only one waiting run per group and drops
# the rest, whatever cancel-in-progress says, so several merges close
# together would leave every commit but the last with no images to deploy
# or roll back to.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every action is pinned to a commit, not a tag: a tag can be moved to
# different code after the fact. The trailing comment is the release that
# commit belongs to, and is what Dependabot reads to propose an update.

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      # 22 is the Node that web/Dockerfile builds the shipped bundle with.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The Makefile assumes web/node_modules exists, as it does on a
      # developer's machine.
      - run: npm ci
        working-directory: web

      - run: make lint

  test:
    runs-on: ubuntu-latest
    # The two database-backed Go packages start a container per test and take
    # about six minutes each on a laptop. 40 leaves room for a slower runner
    # without letting a hung run burn an hour.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # The Go suite needs Docker for testcontainers. The runner has it on
      # the default socket, so none of the DOCKER_HOST settings a laptop
      # needs belong here.
      - run: make test

  images:
    # Builds all three images on a pull request and pushes none of them.
    # Lint and tests never run a Dockerfile, so without this a change to a
    # base image, to the Go build or to the frontend bundle is first tried on
    # main, after it has merged.
    #
    # No registry login: nothing is pushed, and a pull request from Dependabot
    # or a fork has no credentials to log in with.
    #
    # One job with three steps, not a matrix: a matrix reports three check
    # names, and branch protection would have to list each one.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build hearth-api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./api
          target: prod
          push: false
          platforms: linux/amd64
          cache-from: type=gha

      - name: Build hearth-admin
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./api
          target: admin
          push: false
          platforms: linux/amd64
          cache-from: type=gha

      - name: Build hearth-web
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./web
          target: prod
          push: false
          platforms: linux/amd64
          cache-from: type=gha

  build:
    # Both gates in one place. `needs` means a red lint or test run builds
    # nothing. The ref check means a manual run on any other branch builds
    # nothing either: without it, running this workflow by hand on a branch
    # would publish that branch's code under the same image names main uses.
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      # One job per image so a failure names which image failed, rather than
      # one job whose log has to be read to find out.
      matrix:
        include:
          - name: hearth-api
            context: ./api
            target: prod
          - name: hearth-admin
            context: ./api
            target: admin
          - name: hearth-web
            context: ./web
            target: prod
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          # The server is amd64. Building only that platform keeps the job
          # fast; nothing here ever runs on arm64.
          platforms: linux/amd64
          # The SHA tag is the one the Compose file names. :latest exists for
          # humans reading the registry and must never be referenced by a
          # deployment -- see the spec's decision 4 on why a moving tag lets a
          # migration-only change skip its own migration.
          tags: |
            ghcr.io/oandrz/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/oandrz/${{ matrix.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
