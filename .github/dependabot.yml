# Dependabot opens a pull request when something this repository depends on
# has a newer version. Each one runs the same lint and test checks as any
# other pull request, so an update that breaks the build is visible before it
# is merged.
#
# Three choices keep this quiet enough to actually be read:
#   - weekly, not daily;
#   - minor and patch updates arrive as one pull request per ecosystem, and
#     only a major version gets a pull request of its own;
#   - a seven-day cooldown, so a release that is pulled or found malicious in
#     its first week never reaches a pull request here.
#
# Every group below names `update-types: [minor, patch]`. Don't replace that
# with `patterns: ["*"]`: a group with no update types also takes major
# versions, and a major version hidden among routine bumps gets merged
# without being read. The first run of this file did exactly that and
# proposed Postgres 17 -> 18 in the same pull request as a Mailpit patch.
#
# Not covered, because Dependabot cannot see them: the Go version in
# api/go.mod, the tools installed by `go install ...@version` in
# api/Dockerfile and the Makefile, and `npx ...@version` in the Makefile.
# Bump those by hand.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # @types/node describes one Node major. It follows the Node that
    # web/Dockerfile and ci.yml run, not the newest one published, so its
    # major is raised by hand together with those two.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The base images named on the FROM lines of both Dockerfiles.
  - package-ecosystem: docker
    directories: [/api, /web]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      base-images:
        update-types: [minor, patch]

  # The images named in the Compose files: Caddy, Postgres and Mailpit in
  # production, and their development counterparts at the repository root.
  - package-ecosystem: docker-compose
    directories: [/deploy, /]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      compose-images:
        update-types: [minor, patch]
    # A major Postgres version cannot open the previous version's data
    # directory: with only the tag changed, the database refuses to start.
    # That upgrade is a planned dump and restore, never a merged bump, so it
    # is not proposed at all. Minor versions (17.x) still arrive.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]

  # The pinned commits in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      actions:
        update-types: [minor, patch]
