# Dependabot opens a pull request when something this repository depends on
# has a newer version. Each one runs the same lint and test checks as any
# other pull request, so an update that breaks the build is visible before it
# is merged.
#
# Three choices keep this quiet enough to actually be read:
#   - weekly, not daily;
#   - minor and patch updates arrive as one pull request per ecosystem, and
#     only a major version gets a pull request of its own;
#   - a seven-day cooldown, so a release that is pulled or found malicious in
#     its first week never reaches a pull request here.
#
# Not covered, because Dependabot cannot see them: the Go version in
# api/go.mod, the tools installed by `go install ...@version` in
# api/Dockerfile and the Makefile, and `npx ...@version` in the Makefile.
# Bump those by hand.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /api
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  # The base images named on the FROM lines of both Dockerfiles.
  - package-ecosystem: docker
    directories: [/api, /web]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      base-images:
        patterns: ["*"]

  # The images named in the Compose files: Caddy, Postgres and Mailpit in
  # production, and their development counterparts at the repository root.
  - package-ecosystem: docker-compose
    directories: [/deploy, /]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      compose-images:
        patterns: ["*"]

  # The pinned commits in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
