# Key-only. Every account on this box authenticates by key; `deploy` was created
# with --disabled-password and has no password to type. Leaving password auth on
# would accept and evaluate password attempts from the whole internet for no
# benefit at all.
PasswordAuthentication no
KbdInteractiveAuthentication no

# root keeps key access deliberately: `deploy` has no password, so it cannot
# sudo, and locking root out entirely would leave the box with no break-glass
# path short of Hetzner's rescue console.
PermitRootLogin prohibit-password
