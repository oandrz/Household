server {
    listen 80;
    root /usr/share/nginx/html;

    # Exact-match health endpoints must be declared before the SPA fallback
    # below, or nginx's longest-prefix-match would let `location /` swallow
    # them and return index.html with a 200 instead of proxying to the API —
    # matching the dev proxy in vite.config.ts.
    location = /healthz {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /readyz {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same-origin API, so no CORS in production either.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The SPA owns routing: any unknown path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
