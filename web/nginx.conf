# TLS termination is mandatory in front of this container outside
# development. It listens on plain :80 and does nothing with TLS itself --
# a reverse proxy or load balancer in front of it is expected to terminate
# HTTPS and forward to this port. The api service's session and CSRF cookies
# are Secure whenever APP_ENV != development (see .env.example), so a
# browser will refuse to return either cookie unless the connection it sees
# is actually HTTPS. Deployed with nothing terminating TLS in front of this
# config, every cookie is silently dropped and every authenticated request
# 401s -- this file alone cannot fix that; it can only document it.
#
# This file also carries a security control, not just routing: see the
# X-Real-IP / True-Client-IP note above the health-check locations below.
server {
    listen 80;
    root /usr/share/nginx/html;

    # SECURITY: these three lines are what make the X-Real-IP rewriting below
    # meaningful once Caddy sits in front. Without them $remote_addr is Caddy's
    # own address on every request, so the API's per-IP sign-up limiter keys the
    # entire world to one bucket and stops limiting -- silently, with no error
    # anywhere. The subnet is the fixed one declared in
    # deploy/docker-compose.prod.yml; it must stay in step with that file.
    #
    # That CIDR trusts every container on the hearth network, not only Caddy,
    # because Caddy's address within the subnet is assigned by Docker and is
    # not stable enough to name as a /32. Accepted deliberately: reaching this
    # nginx directly requires already having a container on that network, and
    # whoever has that holds postgres and the api too. Everything arriving
    # from the internet crosses Caddy first.
    #
    # real_ip_recursive stays off (nginx's default, stated here because it is
    # load-bearing rather than incidental). Caddy REPLACES X-Forwarded-For
    # with its immediate peer instead of appending to it -- it preserves a
    # caller's value only when that caller is itself listed in Caddy's
    # trusted_proxies, and deploy/Caddyfile lists none -- so nginx sees a
    # single address today and `off` takes that one. The line earns its
    # keep the day something upstream does preserve a caller's list (setting
    # trusted_proxies in Caddy, or putting Cloudflare in front): with `on`,
    # nginx walks the list from the right, skips every entry inside the
    # trusted CIDR above, and lands on the client-supplied value -- the one
    # header the caller fully controls.
    set_real_ip_from  172.28.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive off;

    # Exact-match health endpoints, proxied to the API — matching the dev
    # proxy in vite.config.ts. `location =` always wins over a prefix match
    # like `location /` regardless of declaration order, so these blocks
    # could live anywhere in the file; they're kept up top for readability.
    #
    # SECURITY: X-Real-IP and True-Client-IP below are load-bearing, not
    # redundant with X-Forwarded-For -- do not remove them as boilerplate.
    # The API's chi router runs middleware.RealIP, which picks the client
    # address from the first non-empty of True-Client-IP, X-Real-IP, then
    # X-Forwarded-For (in that order, with no trusted-proxy list) and uses
    # the result to key its per-IP sign-up rate limiter. Left unset, both
    # True-Client-IP and X-Real-IP pass through from the client verbatim
    # and outrank the X-Forwarded-For value nginx appends below, so a
    # caller can set either header to a fresh value on every request and
    # walk straight past the limiter -- burning the sign-up-mail budget
    # and denying everyone else's sign-up mail. Setting X-Real-IP to
    # $remote_addr overwrites the client's value with the actual peer
    # address. Setting True-Client-IP to the empty string is nginx's
    # documented idiom for "strip this header" (proxy_set_header with an
    # empty value omits it from the proxied request rather than sending
    # it empty -- verified below), so RealIP never sees a client-supplied
    # True-Client-IP at all and falls through to the X-Real-IP nginx just
    # set. Either way, $proxy_add_x_forwarded_for is never reached as the
    # deciding header. This must be set on every API-proxying location
    # below -- a caller who finds one location without it can use that
    # one instead.
    #
    # SECURITY, continued: all of the above assumes $remote_addr is the real
    # client's address. THIS nginx is no longer the edge -- Caddy terminates
    # TLS in front of it (docs/adr/0002-first-production-host.md), so the peer
    # address on every request is Caddy's own. The set_real_ip_from block at
    # the top of this server block is what resolves $remote_addr back to the
    # real client before the proxy_set_header lines below read it; deleting it
    # does not break routing or raise an error, it just gives the entire world
    # one shared rate-limit bucket. Anything else that ends up in front -- a
    # Cloudflare tunnel, a managed load balancer -- needs its own address or
    # CIDR added there too, and must append to X-Forwarded-For rather than
    # replace it, the way Caddy does. See docs/SYSTEM_DESIGN.md section 1 and
    # docs/HANDOVER.md section 5.
    location = /healthz {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header True-Client-IP "";
    }

    location = /readyz {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header True-Client-IP "";
    }

    # Same-origin API, so no CORS in production either.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header True-Client-IP "";
    }

    # The SPA owns routing: any unknown path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
