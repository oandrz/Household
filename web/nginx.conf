# TLS termination is mandatory in front of this container outside
# development. It listens on plain :80 and does nothing with TLS itself --
# a reverse proxy or load balancer in front of it is expected to terminate
# HTTPS and forward to this port. The api service's session and CSRF cookies
# are Secure whenever APP_ENV != development (see .env.example), so a
# browser will refuse to return either cookie unless the connection it sees
# is actually HTTPS. Deployed with nothing terminating TLS in front of this
# config, every cookie is silently dropped and every authenticated request
# 401s -- this file alone cannot fix that; it can only document it.
#
# This file also carries a security control, not just routing: see the
# X-Real-IP / True-Client-IP note above the health-check locations below.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Say "nginx", not "nginx/1.27.5": the exact version tells a scanner which
    # published bugs to try.
    server_tokens off;

    # SECURITY HEADERS. Set here rather than in deploy/Caddyfile because this
    # file serves both the app and /api/, it ships inside the image so every
    # environment gets the same headers, and it is the piece that can be run
    # locally to check them in a real browser.
    #
    # They sit at server level and no location below has an add_header of its
    # own. Keep it that way: nginx drops EVERY inherited add_header from a
    # location that declares even one, silently. `always` adds them to error
    # responses (4xx/5xx) too, which is where a framed or sniffed page is
    # just as dangerous.
    #
    # - HSTS: after one visit, the browser refuses plain http for a year, so
    #   hostile Wi-Fi cannot answer a typed "oink.mywire.org" with a fake
    #   sign-in page. Browsers ignore it over http, so it is harmless in local
    #   runs.
    # - CSP: the second wall behind React's escaping. Scripts and API calls
    #   may only come from this origin; the only third party is Google Fonts
    #   (stylesheet + font files, loaded by index.html). No 'unsafe-inline' and
    #   no 'unsafe-eval' anywhere: the build emits no inline script, no eval,
    #   and no inline style attribute (React's style props are set through the
    #   DOM, which CSP allows; the invite QR SVG uses attributes only). If a
    #   change needs one of those, the fix is in the change, not here.
    #   frame-ancestors 'none' stops another site framing Hearth to trick a
    #   click on "Let in" or "Remove member"; X-Frame-Options says the same to
    #   browsers too old for frame-ancestors.
    # - Referrer-Policy no-referrer: magic-link, invite and sign-up tokens
    #   live in URLs, and this keeps them out of the Referer header sent to
    #   Google Fonts or anywhere else.
    # - nosniff: a response is only ever run as the type it says it is.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # SECURITY: these three lines are what make the X-Real-IP rewriting below
    # meaningful once Caddy sits in front. Without them $remote_addr is Caddy's
    # own address on every request, so the API's per-IP sign-up limiter keys the
    # entire world to one bucket and stops limiting -- silently, with no error
    # anywhere. The subnet is the fixed one declared in
    # deploy/docker-compose.prod.yml; it must stay in step with that file.
    #
    # That CIDR trusts every container on the hearth network, not only Caddy,
    # because Caddy's address within the subnet is assigned by Docker and is
    # not stable enough to name as a /32. Documented rather than narrowed,
    # because a /32 would close only one of two equivalent routes: a container
    # on this network can reach api:8080 directly, bypassing nginx altogether,
    # and the API believes X-Real-IP from this same 172.28.0.0/16
    # (TRUSTED_PROXY_CIDRS in deploy/docker-compose.prod.yml) -- so that
    # container can name any client address with nginx never in the path, and
    # tightening this CIDR would not touch it. The boundary that actually
    # holds is that everything arriving from the internet crosses Caddy first.
    #
    # real_ip_recursive stays off (nginx's default, stated here because it is
    # load-bearing rather than incidental). With it off, nginx takes the LAST
    # X-Forwarded-For entry, which is the one written by the trusted upstream
    # it just accepted the header from -- so the control holds whichever
    # mechanism that upstream uses to put the true peer there. Caddy's is
    # replacement: it preserves a caller's list only when that caller is
    # itself listed in Caddy's trusted_proxies, and deploy/Caddyfile lists
    # none, so nginx sees a single address today. Turning it `on` is what
    # would break this: nginx would walk the list from the right, skip every
    # entry inside the trusted CIDR above, and land on a client-supplied
    # value -- the one header the caller fully controls.
    set_real_ip_from  172.28.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive off;

    # Exact-match health endpoints, proxied to the API — matching the dev
    # proxy in vite.config.ts. `location =` always wins over a prefix match
    # like `location /` regardless of declaration order, so these blocks
    # could live anywhere in the file; they're kept up top for readability.
    #
    # SECURITY: X-Real-IP below is load-bearing, not redundant with
    # X-Forwarded-For -- do not remove it as boilerplate. The API reads the
    # client's address from X-Real-IP and from nothing else, and only when the
    # request's own peer is inside TRUSTED_PROXY_CIDRS (trustedProxyRealIP in
    # api/internal/adapter/http); that address keys the per-IP sign-up rate
    # limiter and the admin audit log. Setting X-Real-IP to $remote_addr
    # overwrites whatever the client sent with the peer nginx resolved, so a
    # caller cannot set it to a fresh value on every request and walk straight
    # past the limiter -- burning the sign-up-mail budget and denying
    # everyone else's sign-up mail.
    #
    # True-Client-IP "" is now belt and braces. An empty proxy_set_header
    # value is nginx's idiom for stripping a header from the proxied request,
    # and the API used to need that: chi's middleware.RealIP read
    # True-Client-IP ahead of X-Real-IP, from anyone. The API reads neither
    # True-Client-IP nor X-Forwarded-For today; the line stays so that a
    # future return to a header-order parser cannot quietly reopen the hole.
    #
    # Both must be set on every API-proxying location below -- a caller who
    # finds one location without them can use that one instead.
    #
    # SECURITY, continued: all of the above assumes $remote_addr is the real
    # client's address. THIS nginx is no longer the edge -- Caddy terminates
    # TLS in front of it (docs/adr/0002-first-production-host.md), so the peer
    # address on every request is Caddy's own. The set_real_ip_from block at
    # the top of this server block is what resolves $remote_addr back to the
    # real client before the proxy_set_header lines below read it; deleting it
    # does not break routing or raise an error, it just gives the entire world
    # one shared rate-limit bucket. Anything else that replaces Caddy as the
    # thing talking to this nginx -- a managed load balancer, a tunnel daemon
    # -- needs its own address or CIDR added there too, and must write the
    # true peer as the LAST X-Forwarded-For element; Caddy does that by
    # replacing the header, and appending satisfies it equally, so do not rule
    # a proxy out for choosing either. Something in front of *Caddy* is a
    # different fix and does not belong here: it is trusted_proxies in
    # deploy/Caddyfile, which is what tells Caddy whose forwarded list to
    # believe. See docs/SYSTEM_DESIGN.md section 1 and docs/HANDOVER.md
    # section 5.
    location = /healthz {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header True-Client-IP "";
    }

    location = /readyz {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header True-Client-IP "";
    }

    # Same-origin API, so no CORS in production either.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header True-Client-IP "";
    }

    # The SPA owns routing: any unknown path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
